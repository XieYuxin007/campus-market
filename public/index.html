<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><title>学生主页</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input, textarea, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #52c41a; color: white; border: none; cursor: pointer; }
    .ai-btn { background: #722ed1; }
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
    .item { background: white; padding: 15px; border-radius: 8px; }
    .price { color: red; font-weight: bold; }
    .desc { font-size: 13px; color: #666; }
    .buy-btn { background: #1890ff; width: auto; padding: 8px 15px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal div { background: white; padding: 20px; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h3>发布闲置</h3>
      <input id="title" placeholder="商品名称">
      <input id="price" type="number" placeholder="价格">
      <input id="img" placeholder="图片URL (选填)">
      <textarea id="desc" rows="3" placeholder="描述..."></textarea>
      <button class="ai-btn" onclick="ai()">✨ AI 智能润色</button>
      <button onclick="pub()">发布</button>
    </div>
    <h3>最新上架</h3>
    <div class="list" id="list"></div>
  </div>
  <div class="modal" id="modal">
    <div>
      <h3>预定成功！</h3>
      <p>请联系卖家微信：</p>
      <h2 id="wx" style="color:blue"></h2>
      <button onclick="document.getElementById('modal').style.display='none'" style="background:#ccc">关闭</button>
    </div>
  </div>
  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'student') location.href = '/login.html';

    async function load() {
      const res = await fetch('/api/items');
      const data = await res.json();
      document.getElementById('list').innerHTML = data.data.map(i => `
        <div class="item">
          <h4>${i.title}</h4>
          <div class="price">¥${i.price}</div>
          <div class="desc">${i.description}</div>
          <p style="font-size:12px;color:#999">卖家: ${i.seller_name} | 状态: ${i.status}</p>
          ${i.status === '在售' ? `<button class="buy-btn" onclick="buy(${i.id})">我想要</button>` : ''}
        </div>
      `).join('');
    }

    async function pub() {
      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const desc = document.getElementById('desc').value;
      const img = document.getElementById('img').value;
      await fetch('/api/items', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({title, price, description: desc, image_url: img, seller_id: user.id, seller_name: user.username})
      });
      load();
    }

    async function ai() {
      const title = document.getElementById('title').value;
      if (!title) return alert('先填商品名称');
      const res = await fetch('/api/polish', {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({title})
      });
      const d = await res.json();
      if (d.success) document.getElementById('desc').value = d.description;
    }

    async function buy(id) {
      if (!confirm('确认预定？')) return;
      const res = await fetch(`/api/items/${id}/buy`, {method: 'POST'});
      const d = await res.json();
      if (d.success) {
        document.getElementById('wx').innerText = d.wechat;
        document.getElementById('modal').style.display = 'flex';
        load();
      } else alert(d.message);
    }
    load();
  </script>
</body>
</html>
