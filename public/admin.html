<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><title>管理员后台</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    .del { background: red; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h3>所有商品管理</h3>
    <table>
      <tr><th>ID</th><th>商品名</th><th>卖家</th><th>状态</th><th>操作</th></tr>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'admin') location.href = '/login.html';

    async function load() {
      const res = await fetch('/api/items');
      const data = await res.json();
      document.getElementById('tb').innerHTML = data.data.map(i => `
        <tr>
          <td>${i.id}</td><td>${i.title}</td><td>${i.seller_name}</td><td>${i.status}</td>
          <td><button class="del" onclick="del(${i.id})">强制下架</button></td>
        </tr>
      `).join('');
    }

    async function del(id) {
      if (!confirm('确定删除下架吗？')) return;
      await fetch(`/api/items/${id}?role=admin`, {method: 'DELETE'});
      load();
    }
    load();
  </script>
</body>
</html>
